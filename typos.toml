# typos configuration
# https://github.com/crate-ci/typos

[files]
# Exclude generated/binary files
extend-exclude = [
    "**/*.xcodeproj/**",
    "**/*.pbxproj",
    "**/Package.resolved",
    "**/*.xcassets/**",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.gif",
    "*.ico",
    "*.pdf",
    "*.ddcal",
    # Recorded OpenAI response; its random IDs are not prose
    "ADishADay/Utilities/ExampleResponse.txt",
]

[default.extend-words]
# Project-specific words that aren't typos
udid = "udid"
